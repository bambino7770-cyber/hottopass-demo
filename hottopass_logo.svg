<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="ほっとパス ロゴ">
  <title>ほっとパス 正式ロゴ（Web用ベクターデータ）</title>
  <desc>株式会社いろは デザイン部制作 — 湯けむりマーク＋ワードマーク横組み版</desc>

  <!-- シンボルマーク：湯けむり（温泉記号モチーフ） -->
  <g>
    <circle cx="80" cy="82" r="56" fill="#E8672B"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round">
      <!-- 湯けむり3本（S字カーブ） -->
      <path d="M57 96 Q50 85 57 74 Q64 63 57 52"/>
      <path d="M80 100 Q73 89 80 78 Q87 67 80 48"/>
      <path d="M103 96 Q96 85 103 74 Q110 63 103 52"/>
      <!-- 湯舟 -->
      <path d="M48 112 Q80 130 112 112"/>
    </g>
  </g>

  <!-- ワードマーク -->
  <g>
    <text x="160" y="94"
          font-family="'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif"
          font-size="46" font-weight="700" fill="#2B3A4A">ほっとパス</text>
    <text x="164" y="124"
          font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="15" font-weight="500" letter-spacing="6" fill="#E8672B">HOTTO PASS</text>
    <text x="164" y="142"
          font-family="'Hiragino Sans','Yu Gothic',sans-serif"
          font-size="11" fill="#8A94A0">企業福利厚生のための温浴利用サービス</text>
  </g>
</svg>
